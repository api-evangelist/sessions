name: Sessions
description: >-
  Sessions (Session Technologies, formerly Flow OS) was a Bucharest-based unified
  communication and collaboration platform founded in 2021 by Radu Negulescu and
  Radu Tintescu, backed by earlybird's Digital East Fund (invested 2022, lead Dan
  Lupu). The product bundled voice, video, chat, webinars and meetings with
  third-party productivity integrations on a proprietary "Flow OS" framework at
  sessions.us. As of this enrichment pass (2026-07-21) the company appears
  defunct: the sessions.us domain no longer serves the product (it resolves to an
  unrelated parked/casino-spam page behind a bare-IP TLS certificate), the docs,
  developers and api subdomains do not respond, and no live developer, API,
  OpenAPI, SDK or documentation surface could be located to enrich. This profile
  is retained as a portfolio lead record; no API artifacts exist to harvest.
